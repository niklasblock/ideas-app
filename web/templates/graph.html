<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideen Graph</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body { overflow: hidden; }
        body[data-theme="dark"] .node text {
            fill: #f0f0f0;
        }
        body[data-theme="dark"] .node circle {
            stroke: #27272a;
        }
        body[data-theme="dark"] .link {
            stroke: #666;
        }
        #graph { width: 100vw; height: 100vh; }

        .node circle {
            stroke-width: 2px;
            cursor: pointer;
            transition: r 0.2s;
        }
        .node circle:hover { r: 12; }
        .node text {
            font-size: 12px;
            pointer-events: none;
            dominant-baseline: middle;
        }
        .link {
            stroke: #888;
            stroke-opacity: 0.6;
            stroke-width: 2px;
        }
        .tooltip {
            position: absolute;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .back-btn {
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <svg id="graph"></svg>
    <div class="tooltip" id="tooltip"></div>

    <script>
        const nodes = {{ nodes | tojson }};
        const edges = {{ edges | tojson }};

        const statusColors = {
            raw: "#888780",
            refined: "#378ADD",
            applied: "#1D9E75",
            archived: "#D85A30"
        };

        const svg = d3.select("#graph");
        const width = window.innerWidth;
        const height = window.innerHeight;
        svg.attr("width", width).attr("height", height);

        const g = svg.append("g");

        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        // Link-Anzahl zuerst berechnen
        const linkCount = {};
        nodes.forEach(d => linkCount[d.id] = 0);
        edges.forEach(e => {
            const s = e.source.id || e.source;
            const t = e.target.id || e.target;
            linkCount[s] = (linkCount[s] || 0) + 1;
            linkCount[t] = (linkCount[t] || 0) + 1;
        });

        const radiusScale = d3.scaleLinear()
            .domain([0, d3.max(Object.values(linkCount)) || 1])
            .range([8, 18]);

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(edges).id(d => d.id).distance(120))
            .force("charge", d3.forceManyBody().strength(-200))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(d => radiusScale(linkCount[d.id] || 0) + 15))
            .force("x", d3.forceX(width / 2).strength(0.05))
            .force("y", d3.forceY(height / 2).strength(0.05));

        const link = g.append("g")
            .selectAll("line")
            .data(edges)
            .join("line")
            .attr("class", "link");

        const node = g.append("g")
            .selectAll("g")
            .data(nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstart)
                .on("drag", dragged)
                .on("end", dragend));

        node.append("circle")
            .attr("r", d => radiusScale(linkCount[d.id] || 0))
            .attr("fill", d => statusColors[d.status] || "#888")
            .attr("stroke", "#fff")
            .attr("stroke-width", 2)
            .on("click", (event, d) => {
                window.location.href = `/idea/${d.id}`;
            })
            .on("mouseover", (event, d) => {
                tooltip
                    .style("opacity", 1)
                    .style("left", (event.pageX + 12) + "px")
                    .style("top", (event.pageY - 12) + "px")
                    .html(`<strong>${d.title}</strong><br><span style="color:#aaa">${d.status} · ${linkCount[d.id] || 0} Verbindungen</span>`);
            })
            .on("mouseout", () => tooltip.style("opacity", 0));

        node.append("text")
            .attr("x", 14)
            .attr("y", 0)
            .text(d => d.title.length > 20 ? d.title.slice(0, 20) + "…" : d.title);

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        simulation.on("end", () => {
            console.log('link positions:', edges.map(e => ({x1: e.source.x, y1: e.source.y, x2: e.target.x, y2: e.target.y})));
        });

        setTimeout(() => {
            const bounds = g.node().getBBox();
            if (bounds.width === 0) return;
            const scale = Math.min(0.85 / Math.max(bounds.width / width, bounds.height / height), 1);
            const midX = bounds.x + bounds.width / 2;
            const midY = bounds.y + bounds.height / 2;
            const tx = width / 2 - scale * midX;
            const ty = height / 2 - scale * midY;
            svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
        }, 2000);

        const tooltip = d3.select("#tooltip");

        function dragstart(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
        }
        function dragged(event, d) {
            d.fx = event.x; d.fy = event.y;
        }
        function dragend(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
        }
    </script>
    <script>
        if (new URLSearchParams(window.location.search).get('dark') === '1') {
            document.body.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
